[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen3-forced-aligner"
version = "0.1.0"
description = "Qwen3 Forced Aligner - Audio-Text Alignment Service"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
    {name = "Qwen Team"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
keywords = ["speech", "alignment", "asr", "qwen", "audio", "forced-alignment"]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "numpy>=1.20.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "requests>=2.28.0",
    "nagisa>=0.2.11",
    "soynlp>=0.0.493",
    "qwen-omni-utils",
    "huggingface_hub>=0.20.0",
    "six",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0.0",
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
qwen3-aligner = "qwen3_aligner.cli:main"

[project.urls]
Homepage = "https://github.com/QwenLM/Qwen3-ASR"
Repository = "https://github.com/WEIFENG2333/qwen3-forced-aligner"

[tool.setuptools.packages.find]
include = ["qwen3_aligner*", "qwen_asr*"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
