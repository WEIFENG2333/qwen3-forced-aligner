[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen3-forced-aligner"
version = "0.1.0"
description = "Audio-text forced alignment using Qwen3-ForcedAligner-0.6B"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "liangweifeng", email = "liangweifeng@example.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
keywords = ["speech", "alignment", "asr", "qwen", "audio", "forced-alignment"]
dependencies = [
    "torch>=2.0.0",
    "qwen-asr>=0.0.6",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "huggingface_hub>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0.0",
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
qwen3-aligner = "qwen3_aligner.cli:main"

[project.urls]
Repository = "https://github.com/WEIFENG2333/qwen3-forced-aligner"
Issues = "https://github.com/WEIFENG2333/qwen3-forced-aligner/issues"

[tool.setuptools.packages.find]
include = ["qwen3_aligner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
