name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.0)'
        required: false
        default: ''

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: macos-latest
            platform: darwin
            arch: x64
          - os: macos-14
            platform: darwin
            arch: arm64
          - os: windows-latest
            platform: windows
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Free disk space (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1

      - name: Install system dependencies (macOS)
        if: matrix.platform == 'darwin'
        run: |
          brew install libsndfile

      - name: Install Python dependencies
        run: |
          uv sync --extra dev

      - name: Install CPU-only PyTorch (reduce package size)
        if: matrix.platform == 'linux' || matrix.platform == 'windows'
        run: |
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu --reinstall

      - name: Download model
        run: |
          uv run python -c "
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id='Qwen/Qwen3-ForcedAligner-0.6B',
              local_dir='qwen3_aligner/models',
              local_dir_use_symlinks=False,
          )
          "

      - name: Build with PyInstaller
        run: |
          uv run python build.py

      - name: Copy model to dist
        shell: bash
        run: |
          mkdir -p dist/qwen3-aligner/models
          cp -r qwen3_aligner/models/* dist/qwen3-aligner/models/

      - name: Test executable - help (Unix)
        if: matrix.platform != 'windows'
        run: |
          ./dist/qwen3-aligner/qwen3-aligner --help
          ./dist/qwen3-aligner/qwen3-aligner model-info

      - name: Test executable - help (Windows)
        if: matrix.platform == 'windows'
        run: |
          .\dist\qwen3-aligner\qwen3-aligner.exe --help
          .\dist\qwen3-aligner\qwen3-aligner.exe model-info

      - name: Integration test - alignment (Unix)
        if: matrix.platform != 'windows'
        run: |
          echo "Testing Chinese alignment..."
          ./dist/qwen3-aligner/qwen3-aligner align \
            -a test_audio/test_zh.wav \
            -t "欢迎使用语音对齐" \
            -l zh \
            -f json
          echo ""
          echo "Testing English alignment..."
          ./dist/qwen3-aligner/qwen3-aligner align \
            -a test_audio/test_en.wav \
            -t "Today is a wonderful day" \
            -l en

      - name: Integration test - alignment (Windows)
        if: matrix.platform == 'windows'
        run: |
          echo "Testing Chinese alignment..."
          .\dist\qwen3-aligner\qwen3-aligner.exe align `
            -a test_audio/test_zh.wav `
            -t "欢迎使用语音对齐" `
            -l zh `
            -f json
          echo ""
          echo "Testing English alignment..."
          .\dist\qwen3-aligner\qwen3-aligner.exe align `
            -a test_audio/test_en.wav `
            -t "Today is a wonderful day" `
            -l en

      - name: Get version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=dev-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Create archive (Unix)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCHIVE_NAME="qwen3-aligner-${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}"
          cd dist && zip -r "${ARCHIVE_NAME}.zip" qwen3-aligner/
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV

      - name: Create archive (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $VERSION = "${{ steps.version.outputs.version }}"
          $ARCHIVE_NAME = "qwen3-aligner-${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}"
          Compress-Archive -Path dist/qwen3-aligner -DestinationPath "dist/${ARCHIVE_NAME}.zip"
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-aligner-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*.zip
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.version != ''

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: |
          find artifacts -type f -name "*.zip" | sort

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Qwen3 Forced Aligner ${{ steps.version.outputs.version }}
          tag_name: ${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            artifacts/**/*.zip
          body: |
            ## Qwen3 Forced Aligner ${{ steps.version.outputs.version }}

            Audio-text forced alignment tool using Qwen3-ForcedAligner-0.6B model.

            ### Download

            Choose the appropriate package for your platform:
            - **Linux x64**: `qwen3-aligner-${{ steps.version.outputs.version }}-linux-x64.zip`
            - **macOS x64**: `qwen3-aligner-${{ steps.version.outputs.version }}-darwin-x64.zip`
            - **macOS ARM64**: `qwen3-aligner-${{ steps.version.outputs.version }}-darwin-arm64.zip`
            - **Windows x64**: `qwen3-aligner-${{ steps.version.outputs.version }}-windows-x64.zip`

            ### Quick Start

            1. Download and extract the archive for your platform
            2. Run alignment:
               ```bash
               ./qwen3-aligner align -a audio.wav -t "your text" -l zh
               ```

            The model is included in the package, no additional download needed.
