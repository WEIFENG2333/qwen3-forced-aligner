name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1

      - name: Install Python dependencies
        run: |
          uv sync --extra dev

      - name: Run unit tests
        run: |
          uv run pytest tests/ -v

      - name: Check CLI help
        run: |
          uv run qwen3-aligner --help
          uv run qwen3-aligner align --help
          uv run qwen3-aligner serve --help
          uv run qwen3-aligner download-model --help
          uv run qwen3-aligner model-info --help

      - name: Check model info (no model)
        run: |
          uv run qwen3-aligner model-info

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv sync --extra dev

      - name: Run ruff check
        run: |
          uv run ruff check qwen3_aligner/ tests/

  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1

      - name: Install Python dependencies
        run: |
          uv sync --extra dev

      - name: Test PyInstaller build
        run: |
          uv run python build.py

      - name: Verify executable exists
        run: |
          test -f dist/qwen3-aligner/qwen3-aligner
          ./dist/qwen3-aligner/qwen3-aligner --help
